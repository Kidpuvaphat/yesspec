name: yesspec Daily Price & Monthly SEO Auto-Sync (Shopee & Lazada)

on:
  schedule:
    # รันอัตโนมัติทุกวันเวลา 06:00 น. (เวลาไทย UTC+7 = 23:00 UTC)
    - cron: '0 23 * * *'
  workflow_dispatch: # กดรันเองได้ทุกเมื่อจากหน้า GitHub Actions

permissions:
  contents: write

jobs:
  sync-prices-and-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Daily Price Sync (Shopee & Lazada MCP Connector)
        env:
          SHOPEE_AFF_ID: ${{ secrets.SHOPEE_AFF_ID }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          LAZADA_TRACKING_ID: ${{ secrets.LAZADA_TRACKING_ID }}
        run: python3 price_sync_mcp.py

      - name: Run Monthly Updater & SEO Article Generator
        run: |
          python3 monthly_updater.py
          python3 seo_article_generator.py
          python3 generator.py

      - name: Commit and Push Updated Prices & SEO Pages
        run: |
          git config user.name "yesspec-auto-bot"
          git config user.email "bot@yesspec.com"
          git add data/ dist/
          git diff --staged --quiet || git commit -m "⚡ Auto-sync Shopee & Lazada daily prices & monthly SEO data"
          git push
