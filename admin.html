<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Console</title>
  <link rel="icon" type="image/svg+xml" href="assets/yespec-logo.svg">
  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --line: rgba(0,0,0,0.09);
      --blue: #0071e3;
      --green: #15803d;
      --green-bg: #dcfce7;
      --orange: #ee4d2d;
      --orange-bg: #fff1ee;
      --lazada: #0f146d;
      --lazada-bg: #eef2ff;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Inter", "Noto Sans Thai", "Sukhumvit Set", sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.5; -webkit-font-smoothing: antialiased; }
    .topbar {
      background: rgba(255,255,255,0.92); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--line); padding: 12px 24px;
      position: sticky; top: 0; z-index: 200;
    }
    .topbar-inner {
      max-width: 1280px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.05rem; color: var(--text); text-decoration: none; }
    .container { max-width: 1280px; margin: 0 auto; padding: 28px 20px 90px; }
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 20px;
    }
    .stat-card {
      background: var(--card); border-radius: 18px; padding: 18px 20px;
      border: 1px solid var(--line); box-shadow: 0 4px 16px rgba(0,0,0,0.03);
    }
    .stat-label { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
    .stat-num { font-size: 1.65rem; font-weight: 800; margin-top: 4px; }
    .toolbar {
      background: var(--card); border-radius: 20px; padding: 18px 20px;
      border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(0,0,0,0.04);
      margin-bottom: 20px; position: sticky; top: 61px; z-index: 150;
    }
    .toolbar-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .search-input {
      flex: 2; min-width: 240px; padding: 11px 16px; border-radius: 12px;
      border: 1px solid #d2d2d7; font-size: 0.95rem; background: #fbfbfd;
    }
    .cat-select {
      flex: 1; min-width: 210px; padding: 11px 14px; border-radius: 12px;
      border: 1px solid #d2d2d7; font-size: 0.95rem; background: #fbfbfd; font-weight: 600;
    }
    .filter-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .pill {
      border: 1px solid #d2d2d7; background: #f5f5f7; color: var(--text);
      padding: 6px 14px; border-radius: 99px; font-size: 0.82rem; font-weight: 700; cursor: pointer;
    }
    .pill.active { background: var(--blue); color: #fff; border-color: var(--blue); }
    .prod-list { display: flex; flex-direction: column; gap: 16px; }
    .prod-card {
      background: var(--card); border-radius: 20px; padding: 20px;
      border: 1.5px solid var(--line); box-shadow: 0 4px 16px rgba(0,0,0,0.03);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .prod-card.dirty { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0,113,227,0.12); }
    .prod-card.saved-flash { border-color: #16a34a; box-shadow: 0 0 0 3px rgba(22,163,74,0.2); }
    .prod-header {
      display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
      padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 16px;
    }
    .prod-left { display: flex; align-items: center; gap: 16px; }
    .prod-thumb-wrap {
      width: 78px; height: 78px; border-radius: 14px; background: #f5f5f7;
      border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
      overflow: hidden; flex-shrink: 0;
    }
    .prod-thumb-wrap img { width: 100%; height: 100%; object-fit: contain; }
    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: 0.74rem; font-weight: 800;
    }
    .badge-direct { background: var(--green-bg); color: var(--green); }
    .badge-search { background: #fef3c7; color: #b45309; }
    .badge-manual { background: #dbeafe; color: #1d4ed8; }
    .stores-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px;
    }
    .store-box {
      border-radius: 16px; padding: 16px; border: 1px solid var(--line);
    }
    .store-shopee { background: #fffaf8; border-color: rgba(238,77,45,0.22); }
    .store-lazada { background: #f8f9ff; border-color: rgba(15,20,109,0.18); }
    .store-title {
      font-weight: 800; font-size: 0.92rem; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
    }
    .field-label { display: block; font-size: 0.76rem; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
    .field-input {
      width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid #d2d2d7;
      font-size: 0.88rem; background: #fff;
    }
    .field-row { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 10px; }
    .field-row-3 { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 8px; }
    .btn {
      border: none; border-radius: 99px; padding: 9px 16px; font-size: 0.84rem; font-weight: 700;
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
      text-decoration: none;
    }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-green { background: #16a34a; color: #fff; }
    .btn-outline { background: #fff; color: var(--text); border: 1px solid #d2d2d7; border-radius: 10px; padding: 8px 11px; font-size: 0.78rem; }
    .btn-outline:hover { background: #f5f5f7; }
    .img-row {
      margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line);
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    }
    .toast {
      position: fixed; bottom: 24px; right: 24px; background: #1d1d1f; color: #fff;
      padding: 14px 22px; border-radius: 16px; font-weight: 700; font-size: 0.92rem;
      box-shadow: 0 12px 32px rgba(0,0,0,0.22); z-index: 999; display: none;
    }
    .toast.show { display: block; }
    /* Enterprise Minimal Auth Gate */
    .auth-gate {
      position: fixed; inset: 0; z-index: 500;
      background: radial-gradient(circle at 50% 0%, #18181b 0%, #09090b 100%);
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .auth-card {
      background: rgba(24, 24, 27, 0.85); backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px;
      padding: 40px 36px; max-width: 380px; width: 100%;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55); color: #fafafa;
    }
    .auth-label {
      display: block; font-size: 0.75rem; font-weight: 600; color: #a1a1aa;
      text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px;
    }
    .auth-input {
      width: 100%; padding: 11px 14px; border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12); background: rgba(9, 9, 11, 0.75);
      color: #fafafa; font-size: 0.92rem; outline: none; transition: border-color 0.15s;
    }
    .auth-input:focus { border-color: #3b82f6; }
    .auth-btn {
      width: 100%; padding: 11px 16px; border-radius: 10px; border: none;
      background: #fafafa; color: #09090b; font-weight: 600; font-size: 0.9rem;
      cursor: pointer; transition: opacity 0.15s; margin-top: 8px;
    }
    .auth-btn:hover { opacity: 0.92; }
  </style>
</head>
<body>
  <header class="topbar" id="adminTopbar" style="display:none;">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <svg width="26" height="26" viewBox="0 0 36 36" fill="none" style="border-radius:7px;">
          <rect width="36" height="36" rx="9" fill="#0071e3"/>
          <line x1="9" y1="12" x2="27" y2="12" stroke="white" stroke-opacity="0.35" stroke-width="2.2" stroke-linecap="round"/>
          <line x1="9" y1="12" x2="21" y2="12" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
          <circle cx="21" cy="12" r="3" fill="white"/>
          <line x1="9" y1="18.5" x2="27" y2="18.5" stroke="white" stroke-opacity="0.35" stroke-width="2.2" stroke-linecap="round"/>
          <line x1="9" y1="18.5" x2="14" y2="18.5" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
          <circle cx="14" cy="18.5" r="3" fill="#7cc4ff"/>
          <line x1="9" y1="25" x2="27" y2="25" stroke="white" stroke-opacity="0.35" stroke-width="2.2" stroke-linecap="round"/>
          <line x1="9" y1="25" x2="24" y2="25" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round"/>
          <circle cx="24" cy="25" r="4" fill="#34d399"/>
        </svg>
        <span>yesspec Console</span>
      </a>
      <div style="display:flex;gap:10px;align-items:center;">
        <button class="btn btn-green" id="btnSaveAllDirty" onclick="saveAllDirty()" style="display:none;">
          บันทึกที่แก้ไขทั้งหมด (<span id="dirtyCount">0</span> รุ่น)
        </button>
        <button class="btn btn-outline" id="btnChangePwd" onclick="openPwdModal()">ตั้งค่ารหัสผ่าน</button>
        <button class="btn btn-outline" id="btnLogout" onclick="doLogout()">ออกจากระบบ</button>
        <a class="btn btn-outline" href="index.html" target="_blank">เปิดหน้าเว็บ ↗</a>
      </div>
    </div>
  </header>

  <!-- ENTERPRISE AUTH GATE (ZERO HINTS) -->
  <div id="loginOverlay" class="auth-gate">
    <form onsubmit="event.preventDefault(); doLogin();" class="auth-card" autocomplete="off">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:24px;">
        <svg width="28" height="28" viewBox="0 0 36 36" fill="none" style="border-radius:7px;flex-shrink:0;">
          <rect width="36" height="36" rx="9" fill="#0071e3"/>
          <line x1="9" y1="12" x2="27" y2="12" stroke="white" stroke-opacity="0.35" stroke-width="2.2" stroke-linecap="round"/>
          <line x1="9" y1="12" x2="21" y2="12" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
          <circle cx="21" cy="12" r="3" fill="white"/>
          <line x1="9" y1="18.5" x2="27" y2="18.5" stroke="white" stroke-opacity="0.35" stroke-width="2.2" stroke-linecap="round"/>
          <line x1="9" y1="18.5" x2="14" y2="18.5" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
          <circle cx="14" cy="18.5" r="3" fill="#7cc4ff"/>
          <line x1="9" y1="25" x2="27" y2="25" stroke="white" stroke-opacity="0.35" stroke-width="2.2" stroke-linecap="round"/>
          <line x1="9" y1="25" x2="24" y2="25" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round"/>
          <circle cx="24" cy="25" r="4" fill="#34d399"/>
        </svg>
        <div>
          <div style="font-size:1.02rem;font-weight:700;letter-spacing:-0.01em;color:#fafafa;">Sign in to Console</div>
          <div style="font-size:0.76rem;color:#71717a;">Authorized access only</div>
        </div>
      </div>
      <div style="margin-bottom:16px;">
        <label class="auth-label">Identity</label>
        <input type="text" id="loginUser" class="auth-input" autocomplete="off" spellcheck="false" required>
      </div>
      <div style="margin-bottom:18px;">
        <label class="auth-label">Passkey</label>
        <input type="password" id="loginPass" class="auth-input" autocomplete="current-password" required>
      </div>
      <div id="loginErr" style="color:#f87171;font-size:0.8rem;font-weight:500;margin-bottom:12px;display:none;"></div>
      <button type="submit" class="auth-btn">Continue</button>
    </form>
  </div>

  <!-- CHANGE PASSWORD MODAL -->
  <div id="pwdModal" style="position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:600;display:none;align-items:center;justify-content:center;padding:20px;">
    <form onsubmit="event.preventDefault(); submitChangePwd();" style="background:#fff;border-radius:20px;padding:28px;max-width:380px;width:100%;border:1px solid var(--line);" autocomplete="off">
      <h3 style="margin:0 0 14px;font-size:1.05rem;">เปลี่ยนข้อมูลเข้าสู่ระบบ</h3>
      <div style="margin-bottom:12px;">
        <label class="field-label">Identity ใหม่</label>
        <input type="text" id="newAdminUser" class="field-input" autocomplete="off" required>
      </div>
      <div style="margin-bottom:16px;">
        <label class="field-label">Passkey ใหม่ (อย่างน้อย 8 ตัวอักษร)</label>
        <input type="password" id="newAdminPass" class="field-input" autocomplete="new-password" required>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button type="button" class="btn btn-outline" onclick="document.getElementById('pwdModal').style.display='none'">ยกเลิก</button>
        <button type="submit" class="btn btn-primary">บันทึก</button>
      </div>
    </form>
  </div>

  <main class="container" id="mainDashboard" style="display:none;">
    <p><a class="btn btn-primary" href="/admin/">จัดการ Top 20 · Shopee / Lazada / TikTok Shop →</a></p>
    <!-- DASHBOARD METRICS -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">📦 สินค้าทั้งหมดในระบบ</div>
        <div class="stat-num" id="statTotal">351</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">🟠 ลิงก์ตรง Shopee (Exact PDP)</div>
        <div class="stat-num" id="statShopeeDirect" style="color:var(--orange);">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">🔵 ลิงก์ตรง Lazada (Exact PDP)</div>
        <div class="stat-num" id="statLazadaDirect" style="color:var(--lazada);">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">🖼️ มีรูปสินค้าจริงแล้ว</div>
        <div class="stat-num" id="statWithImg" style="color:var(--green);">-</div>
      </div>
    </div>

    <!-- SEARCH & FILTER TOOLBAR -->
    <div class="toolbar">
      <div class="toolbar-row">
        <input type="search" id="searchInput" class="search-input" placeholder="🔍 ค้นหาชื่อรุ่น หรือ รหัสสินค้า (เช่น iPhone 17 Pro, TCL, Daikin, Sony, Kaniva...)" oninput="renderList()">
        <select id="categorySelect" class="cat-select" onchange="renderList()">
          <option value="all">📂 ทุกหมวดหมู่ (32 หมวด)</option>
        </select>
      </div>
      <div class="filter-pills" id="filterPills">
        <button class="pill active" onclick="setFilter('all', this)">ทั้งหมด</button>
        <button class="pill" onclick="setFilter('missing_sp', this)">🟠 รอแปะลิงก์ตรง Shopee</button>
        <button class="pill" onclick="setFilter('missing_lz', this)">🔵 รอแปะลิงก์ตรง Lazada</button>
        <button class="pill" onclick="setFilter('missing_img', this)">🖼️ ยังไม่มีรูปจริง</button>
        <button class="pill" onclick="setFilter('manual', this)">✏️ แก้ไขเองแล้ว</button>
      </div>
    </div>

    <!-- PRODUCT CARDS LIST -->
    <div id="loadingBox" style="text-align:center;padding:48px;color:var(--muted);font-weight:600;">
      ⏳ กำลังโหลดข้อมูล...
    </div>
    <div class="prod-list" id="productList"></div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    let ALL_PRODUCTS = [];
    let CATEGORIES = [];
    let currentFilter = 'all';
    const dirtyIds = new Set();

    function getAdminToken() {
      return localStorage.getItem('yesspec_admin_token') || '';
    }

    function authHeaders(extra = {}) {
      return Object.assign({ 'X-Admin-Token': getAdminToken() }, extra);
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
    }

    async function doLogin() {
      const username = document.getElementById('loginUser').value.trim();
      const password = document.getElementById('loginPass').value;
      const errEl = document.getElementById('loginErr');
      errEl.style.display = 'none';
      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.ok && data.token) {
          localStorage.setItem('yesspec_admin_token', data.token);
          document.getElementById('loginPass').value = '';
          await loadProducts();
        } else {
          errEl.textContent = data.error || 'Access denied';
          errEl.style.display = 'block';
        }
      } catch (e) {
        errEl.textContent = 'Service unavailable';
        errEl.style.display = 'block';
      }
    }

    function doLogout() {
      localStorage.removeItem('yesspec_admin_token');
      document.getElementById('adminTopbar').style.display = 'none';
      document.getElementById('mainDashboard').style.display = 'none';
      document.getElementById('loginOverlay').style.display = 'flex';
    }

    function openPwdModal() {
      document.getElementById('pwdModal').style.display = 'flex';
    }

    async function submitChangePwd() {
      const new_username = document.getElementById('newAdminUser').value.trim();
      const new_password = document.getElementById('newAdminPass').value;
      try {
        const res = await fetch('/api/admin/change-password', {
          method: 'POST',
          headers: authHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ new_username, new_password })
        });
        const data = await res.json();
        if (data.ok && data.token) {
          localStorage.setItem('yesspec_admin_token', data.token);
          document.getElementById('pwdModal').style.display = 'none';
          document.getElementById('newAdminPass').value = '';
          showToast('บันทึกข้อมูลเข้าสู่ระบบใหม่เรียบร้อย');
        } else {
          showToast(data.error || 'ไม่สามารถเปลี่ยนรหัสผ่านได้');
        }
      } catch (e) {
        showToast('เกิดข้อผิดพลาด');
      }
    }

    async function loadProducts() {
      const token = getAdminToken();
      if (!token) {
        document.getElementById('adminTopbar').style.display = 'none';
        document.getElementById('loginOverlay').style.display = 'flex';
        document.getElementById('mainDashboard').style.display = 'none';
        return;
      }
      try {
        const res = await fetch('/api/admin/products?t=' + Date.now(), {
          cache: 'no-store',
          headers: authHeaders()
        });
        if (res.status === 401) {
          doLogout();
          return;
        }
        if (!res.ok) throw new Error('API error');
        const data = await res.json();
        ALL_PRODUCTS = data.products || [];
        CATEGORIES = data.categories || [];
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('adminTopbar').style.display = 'block';
        document.getElementById('mainDashboard').style.display = 'block';
        populateCategories();
        updateStats();
        document.getElementById('loadingBox').style.display = 'none';
        renderList();
      } catch (err) {
        document.getElementById('loadingBox').innerHTML = 'Service unavailable';
      }
    }

    function populateCategories() {
      const sel = document.getElementById('categorySelect');
      sel.innerHTML = `<option value="all">📂 ทุกหมวดหมู่ (${CATEGORIES.length} หมวด • ${ALL_PRODUCTS.length} รุ่น)</option>` +
        CATEGORIES.map(c => {
          const count = ALL_PRODUCTS.filter(p => p.category_id === c.id).length;
          return `<option value="${c.id}">${c.icon} ${c.name} (${count} รุ่น)</option>`;
        }).join('');
    }

    function updateStats() {
      document.getElementById('statTotal').textContent = ALL_PRODUCTS.length;
      document.getElementById('statShopeeDirect').textContent =
        ALL_PRODUCTS.filter(p => p.shopee.link_type === 'exact_pdp').length + ' / ' + ALL_PRODUCTS.length;
      document.getElementById('statLazadaDirect').textContent =
        ALL_PRODUCTS.filter(p => p.lazada.link_type === 'exact_pdp').length + ' / ' + ALL_PRODUCTS.length;
      document.getElementById('statWithImg').textContent =
        ALL_PRODUCTS.filter(p => !!p.image_url).length + ' / ' + ALL_PRODUCTS.length;
    }

    function setFilter(f, btn) {
      currentFilter = f;
      document.querySelectorAll('#filterPills .pill').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderList();
    }

    function markDirty(pid) {
      dirtyIds.add(pid);
      const card = document.getElementById('card_' + pid);
      if (card) card.classList.add('dirty');
      const btnAll = document.getElementById('btnSaveAllDirty');
      document.getElementById('dirtyCount').textContent = dirtyIds.size;
      btnAll.style.display = dirtyIds.size > 0 ? 'inline-flex' : 'none';
    }

    function previewImgChange(pid, val) {
      markDirty(pid);
      const imgEl = document.getElementById('thumb_' + pid);
      if (imgEl && val.trim()) {
        imgEl.src = val.trim();
      }
    }

    function escAttr(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
    }

    function renderList() {
      const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
      const catId = document.getElementById('categorySelect').value;

      const filtered = ALL_PRODUCTS.filter(p => {
        if (catId !== 'all' && p.category_id !== catId) return false;
        if (currentFilter === 'missing_sp' && p.shopee.link_type === 'exact_pdp') return false;
        if (currentFilter === 'missing_lz' && p.lazada.link_type === 'exact_pdp') return false;
        if (currentFilter === 'missing_img' && p.image_url) return false;
        if (currentFilter === 'manual' && !p.has_manual_override) return false;
        if (q) {
          const hay = `${p.id} ${p.name} ${p.category_name} ${p.eyebrow}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      const listEl = document.getElementById('productList');
      const displaySlice = filtered.slice(0, 80);

      listEl.innerHTML = displaySlice.map(p => {
        const spDirect = p.shopee.link_type === 'exact_pdp';
        const lzDirect = p.lazada.link_type === 'exact_pdp';
        const thumbHtml = p.image_url
          ? `<img id="thumb_${p.id}" src="${escAttr(p.image_url)}" referrerpolicy="no-referrer" onerror="this.style.opacity=0.2">`
          : `<img id="thumb_${p.id}" src="assets/yespec-logo.svg" style="opacity:0.35">`;

        return `
          <div class="prod-card" id="card_${p.id}">
            <div class="prod-header">
              <div class="prod-left">
                <div class="prod-thumb-wrap">${thumbHtml}</div>
                <div>
                  <div style="font-size:0.78rem;color:var(--muted);font-weight:700;">
                    ${p.category_icon} ${p.category_name} • <code>${p.id}</code>
                    ${p.has_manual_override ? '<span class="badge badge-manual" style="margin-left:6px;">✏️ ตั้งค่าเองแล้ว</span>' : ''}
                  </div>
                  <div style="font-size:1.12rem;font-weight:800;margin:2px 0;">${escAttr(p.name)}</div>
                  <div style="font-size:0.82rem;color:var(--muted);">
                    ราคาโชว์หน้าเว็บปัจจุบัน: <strong style="color:var(--green);font-size:0.95rem;">${p.display_price == null ? 'รอตรวจราคา' : '฿' + Number(p.display_price).toLocaleString()}</strong>
                  </div>
                </div>
              </div>
              <div style="display:flex;gap:8px;align-items:center;">
                <button class="btn btn-primary" onclick="saveOneProduct('${p.id}')">
                  💾 บันทึกรุ่นนี้ขึ้นเว็บทันที
                </button>
              </div>
            </div>

            <div class="stores-grid">
              ${renderStoreFields(p, 'shopee')}
              ${renderStoreFields(p, 'lazada')}
            </div>

            <!-- IMAGE URL + PRODUCT NAME + REAL SALES COUNT ROW -->
            <div class="img-row" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end;">
              <div>
                <label class="field-label">✏️ ชื่อรุ่น / ความจุ (แก้ชื่อรุ่นให้ตรงกับที่ขายดีจริงได้):</label>
                <input type="text" class="field-input" id="prod_name_${p.id}" value="${escAttr(p.name)}" placeholder="เช่น Samsung Galaxy A07 หรือ A06 (64GB)" oninput="markDirty('${p.id}')">
              </div>
              <div>
                <label class="field-label">🖼️ URL รูปสินค้าจริง (จาก Shopee / Lazada):</label>
                <input type="text" class="field-input" id="img_url_${p.id}" value="${escAttr(p.image_url)}" placeholder="วางลิงก์รูปสินค้า https://down-aka-th.img.susercontent.com/..." oninput="previewImgChange('${p.id}', this.value)">
              </div>
            </div>
          </div>
        `;
      }).join('') + (filtered.length > 80
        ? `<div style="text-align:center;padding:18px;color:var(--muted);font-weight:600;">แสดง 80 รุ่นแรกจากทั้งหมด ${filtered.length} รุ่น — ใช้ช่องค้นหาหรือเลือกหมวดหมู่ด้านบนเพื่อเจาะจงรุ่นได้ทันที</div>`
        : '');
    }

    function renderStoreFields(p, platform) {
      const st = p[platform], prefix = platform === 'shopee' ? 'sp' : 'lz';
      const label = platform === 'shopee' ? 'Shopee' : 'Lazada';
      const val = (key, value, type = 'text') => `<input type="${type}" step="any" class="field-input" id="${prefix}_${key}_${p.id}" value="${escAttr(value ?? '')}" oninput="markDirty('${p.id}')">`;
      const options = (key, values, selected) => `<select class="field-input" id="${prefix}_${key}_${p.id}" onchange="markDirty('${p.id}')">${values.map(([value, text]) => `<option value="${value}" ${selected === value ? 'selected' : ''}>${text}</option>`).join('')}</select>`;
      const editable = st.source === 'manual' || st.source === 'official_api';
      return `<div class="store-box store-${platform}">
        <div class="store-title"><span>${label}</span><span class="badge ${st.ranking_eligible ? 'badge-direct' : 'badge-search'}">${st.ranking_eligible ? 'ตรวจราคาแล้ว' : st.status === 'stale' ? 'ข้อมูลเกิน 48 ชั่วโมง' : st.status === 'variant_mismatch' ? 'ตัวเลือกสองร้านไม่ตรงกัน' : 'รอตรวจสอบ'}</span></div>
        <label class="field-label">ลิงก์ซื้อ / Affiliate ที่ได้จากแพลตฟอร์ม</label>
        <div class="field-row">${val('link', st.link)}<button class="btn btn-outline" onclick="autoExtract('${p.id}', '${platform}')">ตรวจรหัส</button><a class="btn btn-outline" href="${escAttr(st.link || '#')}" target="_blank" rel="noopener noreferrer">เปิดดู ↗</a></div>
        <label class="field-label">URL หน้าสินค้าต้นทางแบบเต็ม (หลังเปิดลิงก์ย่อ)</label>${val('product_url', st.product_url)}
        <label class="field-label">ตัวเลือกที่ตรงรุ่น (ใช้คำเดียวกันทั้งสองร้าน) เช่น 128GB / เครื่องเปล่า / ประกันศูนย์</label>${val('variant', st.variant)}
        <div class="field-row-3"><div><label class="field-label">ราคาที่เห็น (บาท)</label>${val('price', editable ? st.candidate_price : '', 'number')}</div><div><label class="field-label">ราคาขีดฆ่า ถ้ามี</label>${val('orig', editable ? st.candidate_original_price : '', 'number')}</div><div><label class="field-label">ชื่อร้าน</label>${val('shop', st.shop_name)}</div></div>
        <div class="field-row"><div><label class="field-label">ประเภทราคา</label>${options('price_basis', [['sku','ตัวเลือกที่ระบุ'],['member','ราคา VIP / สมาชิก (ใช้จัดอันดับได้)'],['starting','ราคาเริ่มต้น'],['coupon','มีเงื่อนไขคูปอง']], st.price_basis || 'sku')}</div><div><label class="field-label">สถานะสินค้า</label>${options('availability', [['unknown','ยังไม่ทราบ'],['in_stock','มีสินค้า'],['out_of_stock','หมดสินค้า']], st.availability || 'unknown')}</div></div>
        <div class="field-row"><div><label class="field-label">ข้อความยอดขายตามหน้าร้าน เช่น 1.2 พัน+</label>${val('sold_text', st.sales?.raw)}</div><div><label class="field-label">ช่วงเวลาของยอดขาย</label>${options('sold_period', [['unknown','ไม่ระบุ'],['lifetime','สะสม'],['30d','30 วัน']], st.sales?.period || 'unknown')}</div></div>
        <label class="field-label">ขอบเขตยอดขาย</label>${options('sold_scope', [['listing','ทั้งหน้าสินค้า (รวมตัวเลือก)'],['sku','เฉพาะตัวเลือกนี้']], st.sales?.scope || 'listing')}
        <label style="display:block;margin-top:12px;font-size:13px;"><input type="checkbox" id="${prefix}_confirmed_${p.id}" onchange="markDirty('${p.id}')"> ฉันเปิดลิงก์และตรวจรุ่น ตัวเลือก ราคา และข้อความยอดขาย ณ ตอนนี้แล้ว</label>
        <p style="font-size:12px;color:var(--muted);">ตรวจล่าสุด: ${st.observed_at ? new Date(st.observed_at).toLocaleString('th-TH') : 'ยังไม่มีหลักฐาน'} • การตรวจนี้ไม่ยืนยันการติดตามค่าคอมมิชชัน</p>
      </div>`;
    }

    function collectProductPayload(pid) {
      const data = {id: pid, name: document.getElementById('prod_name_' + pid)?.value.trim() || '', image_url: document.getElementById('img_url_' + pid)?.value.trim() || ''};
      for (const [platform, prefix] of [['shopee','sp'], ['lazada','lz']]) {
        for (const field of ['link','product_url','variant','price','shop','price_basis','availability','sold_text','sold_period','sold_scope']) {
          data[platform + '_' + field] = document.getElementById(prefix + '_' + field + '_' + pid)?.value.trim() || '';
        }
        data[platform + '_orig_price'] = document.getElementById(prefix + '_orig_' + pid)?.value.trim() || '';
        data[platform + '_confirmed'] = document.getElementById(prefix + '_confirmed_' + pid)?.checked === true;
      }
      return data;
    }

    async function saveOneProduct(pid) {
      const payload = collectProductPayload(pid);
      try {
        const res = await fetch('/api/admin/save-product', {
          method: 'POST',
          headers: authHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify(payload)
        });
        if (res.status === 401) { doLogout(); return; }
        const data = await res.json();
        if (data.ok) {
          dirtyIds.delete(pid);
          const card = document.getElementById('card_' + pid);
          if (card) {
            card.classList.remove('dirty');
            card.classList.add('saved-flash');
            setTimeout(() => card.classList.remove('saved-flash'), 1800);
          }
          document.getElementById('dirtyCount').textContent = dirtyIds.size;
          document.getElementById('btnSaveAllDirty').style.display = dirtyIds.size > 0 ? 'inline-flex' : 'none';
          showToast(`✅ บันทึก "${pid}" ขึ้นเว็บ yesspec.com เรียบร้อยแล้ว!`);
          await loadProducts();
        } else {
          showToast('❌ เกิดข้อผิดพลาด: ' + (data.error || 'Unknown'));
        }
      } catch (e) {
        showToast('❌ ไม่สามารถบันทึกได้ กรุณาลองอีกครั้ง');
      }
    }

    async function saveAllDirty() {
      const list = Array.from(dirtyIds).map(pid => collectProductPayload(pid));
      if (list.length === 0) return;
      try {
        const res = await fetch('/api/admin/save-product', {
          method: 'POST',
          headers: authHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ products: list })
        });
        if (res.status === 401) { doLogout(); return; }
        const data = await res.json();
        if (data.ok) {
          dirtyIds.clear();
          document.getElementById('btnSaveAllDirty').style.display = 'none';
          showToast(`✅ บันทึกทั้ง ${data.updated_count} รุ่นขึ้นเว็บ yesspec.com สำเร็จ!`);
          await loadProducts();
        } else { showToast(data.error || "บันทึกไม่สำเร็จ"); }
      } catch (e) {
        showToast('❌ ไม่สามารถบันทึกได้');
      }
    }

    async function autoExtract(pid, platform) {
      const inputId = (platform === 'shopee' ? 'sp_link_' : 'lz_link_') + pid;
      const url = document.getElementById(inputId)?.value.trim();
      if (!url) {
        showToast('⚠️ กรุณาวางลิงก์ก่อนกดดึงข้อมูลครับ');
        return;
      }
      showToast('⏳ กำลังดึงข้อมูลจากลิงก์...');
      try {
        const res = await fetch('/api/admin/extract-url', {
          method: 'POST',
          headers: authHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ url, id: pid })
        });
        const data = await res.json();
        if (data.ok) {
          if (data.resolved_url) {
            document.getElementById((platform === 'shopee' ? 'sp' : 'lz') + '_product_url_' + pid).value = data.resolved_url;
            markDirty(pid);
          }
          showToast(data.message);
        } else { showToast(data.error || "ตรวจลิงก์ไม่สำเร็จ"); }
      } catch (e) {
        showToast('ℹ️ กรุณากรอกราคาแล้วกดบันทึกได้เลยครับ');
      }
    }

    loadProducts();
  </script>
</body>
</html>
